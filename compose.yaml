# This docker compose file runs Grafana with the plugin against SurrealDB 3.x.
# It is used by the CI pipeline and can also be used for local development.

services:
  grafana:
    container_name: grafana
    build:
      context: ./.config
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-13.1.0}
        # remove the following line when developing to have backend debugger
        development: "false"
    ports:
      - 3000:3000
    volumes:
      - ./dist:/var/lib/grafana/plugins/grafana-surrealdb-datasource
      - ./provisioning:/etc/grafana/provisioning
      - .:/root/grafana-surrealdb-datasource
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/login"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    environment:
      - GF_LOG_LEVEL=debug
    networks:
      - surrealdb
  surrealdb:
    image: surrealdb/surrealdb:v3.1.5
    container_name: surrealdb
    restart: always
    command: start memory --log trace --username root --password test --allow-all
    ports:
      - 8000:8000
    networks:
      - surrealdb
  test-data-loader:
    image: curlimages/curl:latest
    container_name: test-data-loader
    # SurrealDB 3.x does not auto-create the namespace/database on import, so
    # define them before importing the fixture (which contains no DEFINE
    # NAMESPACE/DATABASE of its own). Wait for the server to be healthy first.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -sf http://surrealdb:8000/health >/dev/null 2>&1; do
          echo "waiting for surrealdb..."; sleep 1;
        done
        echo "ensuring namespace/database exist..."
        curl -sS -u 'root:test' -H 'Accept: application/json' \
          -X POST http://surrealdb:8000/sql --data 'DEFINE NAMESPACE IF NOT EXISTS test;'
        curl -sS -u 'root:test' -H 'surreal-ns: test' -H 'Accept: application/json' \
          -X POST http://surrealdb:8000/sql --data 'DEFINE DATABASE IF NOT EXISTS test;'
        echo "importing fixture..."
        curl -v -X POST -u 'root:test' \
          -H 'surreal-ns: test' -H 'surreal-db: test' -H 'Accept: application/json' \
          --data-binary @/dev/shm/surreal-deal-store.surql http://surrealdb:8000/import
        echo "fixture import finished"
    depends_on:
      - surrealdb
    restart: on-failure
    volumes:
      - ./tests/fixtures/surreal-deal-store.surql:/dev/shm/surreal-deal-store.surql
    networks:
      - surrealdb

networks:
  surrealdb:
